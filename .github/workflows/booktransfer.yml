name: Build Book Transfer mod

on:
  push:
    paths:
      - 'booktransfer/**'
      - '.github/workflows/booktransfer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booktransfer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Print jar (base64)
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          echo "JARNAME $(basename $JAR)"
          echo "JARSHA $(sha256sum $JAR | cut -d' ' -f1)"
          echo "B64BEGIN"
          base64 -w 100 "$JAR" | sed 's/^/B64 /'
          echo "B64END"
      - uses: actions/upload-artifact@v4
        with:
          name: booktransfer-mod
          path: booktransfer/build/libs/*.jar
